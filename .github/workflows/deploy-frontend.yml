name: Deploy Frontend

on:
  push:
    branches:
      - main
      - qa
      - dev
    paths:
      - client/**
      - .github/workflows/deploy-frontend.yml
      - DEPLOYMENT.md
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: prod
        options:
          - prod
          - qa
          - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Ensure Apache rewrite file is in the build
        shell: bash
        run: cp public/.htaccess dist/.htaccess

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          remote_base_dir="${{ vars.FTP_REMOTE_BASE_DIR }}"
          if [ -z "$remote_base_dir" ]; then
            remote_base_dir="/home/voyahsek/voyagersupplychain.com/voyserv"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.target }}"
          else
            case "${GITHUB_REF_NAME}" in
              main) target="prod" ;;
              qa) target="qa" ;;
              dev) target="dev" ;;
              *)
                echo "Unsupported branch: ${GITHUB_REF_NAME}"
                exit 1
                ;;
            esac
          fi

          echo "remote_base_dir=$remote_base_dir" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: client/dist/
          server-dir: ${{ steps.target.outputs.remote_base_dir }}/${{ steps.target.outputs.target }}/
          dangerous-clean-slate: true
