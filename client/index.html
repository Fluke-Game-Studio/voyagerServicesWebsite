    <meta
      name="description"
      content="Voyager Services — a managed, asset-light U.S. supply chain control tower for global manufacturers. You manufacture. We coordinate. You sell. We deliver."

      rel="stylesheet"
    />

    <!-- Eliminate flash of unstyled background -->

      html { background: #070b14; }
    </style>
  </head>

    <script type="module" src="/src/main.tsx"></script>
